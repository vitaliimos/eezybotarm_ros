camera:
  ros__parameters:
    video_device: "/dev/video0"
    image_size: [1280, 720]
    time_per_frame: [1, 10]
    pixel_format: "YUYV"
    output_encoding: "yuv422_yuy2"
    camera_name: "camera"
    camera_frame_id: "camera_optical_frame"
    auto_exposure: 3
    focus_automatic_continuous: false
    focus_absolute: 0
    zoom_absolute: 0
    pan_absolute: 0
    tilt_absolute: 0

mock_camera:
  ros__parameters:
    publish_rate: 15.0
    frame_id: "camera_optical_frame"

sorting_coordinator_node:
  ros__parameters:
    # Path to TensorRT engine (.engine). Default target location on Jetson.
    weights_path: "/usr/share/models/model.engine"
    conf_threshold: 0.5
    stable_frames_required: 5
    cooldown_duration_sec: 1
    action_name: "pick_and_place"
    debug_image_jpeg_quality: 80
    recalibration_interval_sec: 3.0
    calibration_smoothing_alpha: 0.25
