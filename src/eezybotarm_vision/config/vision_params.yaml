camera:
  ros__parameters:
    video_device: "/dev/video0"
    image_size: [800, 600]
    time_per_frame: [1, 10]
    pixel_format: "YUYV"
    output_encoding: "yuv422_yuy2"
    camera_name: "camera"
    camera_frame_id: "camera_optical_frame"
    brightness: 135
    auto_exposure: 1
    exposure_time_absolute: 156

mock_camera:
  ros__parameters:
    publish_rate: 15.0
    frame_id: "camera_optical_frame"

sorting_coordinator_node:
  ros__parameters:
    # Path to TensorRT engine (.engine). Default target location on Jetson.
    weights_path: "/usr/share/models/model.engine"
    conf_threshold: 0.5
    iou_threshold: 0.45
    stable_frames_required: 8
    cooldown_duration_sec: 2.5
    action_name: "pick_and_place"
